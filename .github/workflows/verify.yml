# Verifies this package as published: TypeScript build and unit tests, and a
# build of the native modules inside a freshly generated React Native app
# (Android on Linux, iOS on macOS) that installs the packed tarball.
# Runs on every push and on demand; free on a public repository.

name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Pack
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: appdiscovery-react-native-*.tgz

  android:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate a React Native app
        run: npx --yes @react-native-community/cli@latest init Verify --skip-install --skip-git-init --pm npm
      - name: Install the app and the package
        working-directory: Verify
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund ../appdiscovery-react-native-*.tgz
      - name: Use the package from the app
        working-directory: Verify
        run: |
          node <<'JS'
          const fs = require('fs');
          const app = fs.readFileSync('App.tsx', 'utf8');
          const use = 'import { AppDiscovery } from "appdiscovery-react-native";\nvoid AppDiscovery.isInitialized;\n';
          fs.writeFileSync('App.tsx', use + app);
          JS
      - name: Build the Android app
        working-directory: Verify/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate a React Native app
        run: npx --yes @react-native-community/cli@latest init Verify --skip-install --skip-git-init --pm npm
      - name: Install the app and the package
        working-directory: Verify
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund ../appdiscovery-react-native-*.tgz
      - name: Use the package from the app
        working-directory: Verify
        run: |
          node <<'JS'
          const fs = require('fs');
          const app = fs.readFileSync('App.tsx', 'utf8');
          const use = 'import { AppDiscovery } from "appdiscovery-react-native";\nvoid AppDiscovery.isInitialized;\n';
          fs.writeFileSync('App.tsx', use + app);
          JS
      - name: Install pods
        working-directory: Verify
        run: |
          bundle install
          cd ios && bundle exec pod install
      - name: Build the iOS app (simulator)
        working-directory: Verify/ios
        run: |
          xcodebuild -workspace Verify.xcworkspace -scheme Verify -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
